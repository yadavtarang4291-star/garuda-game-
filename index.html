<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Garuda Hunt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Hind:wght@400;600&family=Rozha+One&display=swap">
  <style>
    /* Layout: full-screen dusk sky canvas, score/time strip pinned on top, one centered card for start and finish. */
    :root {
      --sky-top: #1a1445;
      --sky-mid: #5b2a6e;
      --sky-low: #d4553f;
      --sky-hor: #f7a64c;
      --gold: #f2b33d;
      --crimson: #c2282d;
      --cream: #fff1d0;
      --ink: #140f2b;
      --panel: rgba(20, 15, 43, 0.88);
      --alert: #ff8a78;
      --font-display: 'Rozha One', Georgia, 'Times New Roman', serif;
      --font-body: 'Hind', system-ui, -apple-system, 'Segoe UI', sans-serif;
      color-scheme: dark;
    }

    html,
    body {
      height: 100%;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      background: var(--ink);
      color: var(--cream);
      font-family: var(--font-body);
      font-size: 16px;
      overflow: hidden;
    }

    #stage {
      position: relative;
      width: 100%;
      height: 100%;
    }

    #cv {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: crosshair;
    }

    #hud {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px 20px;
      padding-block: 10px;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      pointer-events: none;
      text-shadow: 0 1px 10px rgba(20, 15, 43, 0.7);
    }

    .stats {
      display: flex;
      gap: 6px 28px;
      flex-wrap: wrap;
    }

    .stat {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .label {
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--cream);
      opacity: 0.85;
    }

    .num {
      font-family: var(--font-display);
      font-size: 38px;
      line-height: 1.05;
      font-variant-numeric: tabular-nums;
      color: var(--gold);
    }

    .num.low {
      color: var(--alert);
    }

    button {
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      border-radius: 6px;
      border: 2px solid var(--gold);
    }

    button:focus-visible {
      outline: 3px solid var(--cream);
      outline-offset: 3px;
    }

    #snd {
      pointer-events: auto;
      background: var(--panel);
      color: var(--cream);
      padding: 8px 14px;
      font-size: 14px;
    }

    #go {
      background: var(--gold);
      color: var(--ink);
      padding: 13px 30px;
      margin-top: 6px;
    }

    #go:hover {
      background: var(--cream);
    }

    #card {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      align-content: center;
      padding-block: 24px;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
    }

    .panel {
      width: min(420px, 100%);
      box-sizing: border-box;
      text-align: center;
      background: var(--panel);
      border: 1px solid rgba(242, 179, 61, 0.55);
      border-radius: 10px;
      padding: 26px 24px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    h1 {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: clamp(44px, 12vw, 64px);
      line-height: 1;
      margin: 0;
      color: var(--gold);
      text-wrap: balance;
    }

    .deva {
      font-family: var(--font-display), 'Noto Sans Devanagari', serif;
      font-size: 22px;
      margin: 0;
      color: var(--cream);
      letter-spacing: 0.04em;
    }

    .panel p {
      margin: 0;
      line-height: 1.5;
      max-width: 34ch;
    }

    #msg {
      color: var(--cream);
    }

    #best-note {
      color: var(--gold);
      font-weight: 600;
    }
  </style>

</head>

<body>
  <div id="stage">
    <canvas id="cv" aria-label="Garuda hunting small birds in a dusk sky"></canvas>
    <div id="hud">
      <div class="stats">
        <div class="stat"><span class="label">Birds caught</span><span id="score" class="num">0</span></div>
        <div class="stat"><span class="label">Time left</span><span id="time" class="num">60</span></div>
        <div class="stat"><span class="label">Best</span><span id="best" class="num">0</span></div>
      </div>
      <button id="snd" type="button" aria-pressed="false">Sound: on</button>
    </div>
    <div id="card">
      <div class="panel">
        <h1 id="title">Garuda</h1>
        <p class="deva" lang="hi">गरुड़</p>
        <p id="msg">Drag with your finger or mouse, or use the arrow keys or W A S D, to fly. Touch a small bird to
          catch it. Every bird is 1 point. You have 60 seconds.</p>
        <p id="best-note" hidden></p>
        <button id="go" type="button">Start hunting</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var cv = document.getElementById('cv');
      var ctx = cv.getContext('2d');
      var $ = function (id) { return document.getElementById(id); };
      var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

      var COL = {
        gold: '#f2b33d', goldDeep: '#d98a1f', crimson: '#c2282d', crimsonDeep: '#7e1620',
        cream: '#fff1d0', ink: '#140f2b', beak: '#ff9f1c'
      };
      var BIRD_COLORS = ['#4fc3c7', '#e9739b', '#8bc34a', '#6c8ef5', '#f5a25d'];

      var W = 0, H = 0, DPR = 1, S = 50, sky = null, stars = [], clouds = [];
      var state = 'idle', timeLeft = 60, score = 0, best = 0, spawnT = 0, elapsed = 0, shake = 0;
      try { best = parseInt(localStorage.getItem('garuda-best'), 10) || 0; } catch (e) { }
      $('best').textContent = best;

      var P = { x: 0, y: 0, vx: 0, vy: 0, face: 1, flap: 0 };
      var birds = [], parts = [], texts = [];
      var keys = {}, ptr = null;
      var AC = null, muted = false;

      function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

      function resize() {
        var r = cv.getBoundingClientRect();
        DPR = Math.min(window.devicePixelRatio || 1, 2);
        W = r.width; H = r.height;
        cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
        S = clamp(Math.min(W, H) * 0.09, 30, 70);
        sky = ctx.createLinearGradient(0, 0, 0, H);
        sky.addColorStop(0, '#1a1445'); sky.addColorStop(0.45, '#5b2a6e');
        sky.addColorStop(0.8, '#d4553f'); sky.addColorStop(1, '#f7a64c');
        stars = [];
        for (var i = 0; i < 45; i++) stars.push({ x: Math.random() * W, y: Math.random() * H * 0.42, r: 0.6 + Math.random() * 1.2, a: 0.3 + Math.random() * 0.6 });
        clouds = [];
        for (var j = 0; j < 7; j++) clouds.push({ x: Math.random() * W, y: H * (0.18 + Math.random() * 0.5), s: 0.7 + Math.random() * 1.1, v: 6 + Math.random() * 10 });
        if (!P.x) { P.x = W * 0.5; P.y = H * 0.45; }
        P.x = clamp(P.x, S * 0.6, W - S * 0.6); P.y = clamp(P.y, S * 0.6, H - S * 0.6);
      }

      /* ---------- audio ---------- */
      function chirp() {
        if (muted || !AC) return;
        try {
          var o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
          o.type = 'triangle';
          o.frequency.setValueAtTime(800 + Math.random() * 300, t);
          o.frequency.exponentialRampToValueAtTime(1900, t + 0.08);
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.12, t + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
          o.connect(g); g.connect(AC.destination);
          o.start(t); o.stop(t + 0.17);
        } catch (e) { }
      }

      /* ---------- birds ---------- */
      function spawnBird() {
        var dir = Math.random() < 0.5 ? 1 : -1;
        var sc = 0.8 + Math.random() * 0.7;
        var speed = (70 + Math.random() * 110 + elapsed * 1.2) * (S / 50);
        birds.push({
          x: dir > 0 ? -40 : W + 40, y: H * (0.12 + Math.random() * 0.76),
          vx: dir * speed, vy: 0, r: 11 * sc * (S / 50), dir: dir,
          ph: Math.random() * 6.28, c: BIRD_COLORS[(Math.random() * BIRD_COLORS.length) | 0]
        });
      }

      function burst(x, y, c) {
        var n = reduce ? 4 : 10;
        for (var i = 0; i < n; i++) {
          var a = Math.random() * 6.28, sp = 60 + Math.random() * 190;
          parts.push({
            x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40, rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 10,
            life: 0.8 + Math.random() * 0.5, max: 1.2, c: i % 3 === 0 ? COL.gold : c, len: 5 + Math.random() * 6
          });
        }
      }

      function setScore(v) { score = v; $('score').textContent = v; }

      function catchBird(b) {
        setScore(score + 1);
        burst(b.x, b.y, b.c);
        texts.push({ x: b.x, y: b.y - b.r, life: 0.9, txt: '+1' });
        if (!reduce) shake = 7;
        chirp();
      }

      /* ---------- game flow ---------- */
      function startGame() {
        try {
          AC = AC || new (window.AudioContext || window.webkitAudioContext)();
          if (AC.state === 'suspended') AC.resume();
        } catch (e) { }
        birds = []; parts = []; texts = [];
        setScore(0); timeLeft = 60; elapsed = 0; spawnT = 0; shake = 0;
        $('time').textContent = '60'; $('time').classList.remove('low');
        state = 'play';
        $('card').hidden = true;
      }

      function endGame() {
        state = 'over';
        var isBest = score > best;
        if (isBest) {
          best = score; $('best').textContent = best;
          try { localStorage.setItem('garuda-best', String(best)); } catch (e) { }
        }
        $('title').textContent = 'Time up';
        $('msg').textContent = 'Garuda caught ' + score + (score === 1 ? ' bird.' : ' birds.');
        var note = $('best-note');
        note.hidden = false;
        note.textContent = isBest && score > 0 ? 'New best score.' : 'Best score: ' + best;
        $('go').textContent = 'Hunt again';
        $('card').hidden = false;
        $('go').focus();
      }

      /* ---------- update ---------- */
      function update(dt, T) {
        var playing = state === 'play';
        if (playing) {
          elapsed += dt; timeLeft -= dt;
          var shown = Math.max(0, Math.ceil(timeLeft));
          var tEl = $('time');
          if (tEl.textContent !== String(shown)) { tEl.textContent = shown; }
          if (shown <= 10) tEl.classList.add('low');
          if (timeLeft <= 0) endGame();
        }

        // Garuda movement
        var sp = S * 9, tx = 0, ty = 0;
        if (playing) {
          if (ptr) {
            tx = clamp((ptr.x - P.x) * 5, -sp * 1.4, sp * 1.4);
            ty = clamp((ptr.y - P.y) * 5, -sp * 1.4, sp * 1.4);
          } else {
            tx = ((keys.right ? 1 : 0) - (keys.left ? 1 : 0)) * sp;
            ty = ((keys.down ? 1 : 0) - (keys.up ? 1 : 0)) * sp;
            if (tx && ty) { tx *= 0.707; ty *= 0.707; }
          }
        } else {
          tx = (W * 0.5 - P.x) * 0.8 + Math.cos(T * 0.6) * W * 0.1;
          ty = (H * 0.45 - P.y) * 0.8 + Math.cos(T * 0.9) * H * 0.05;
        }
        var k = Math.min(1, dt * 7);
        P.vx += (tx - P.vx) * k; P.vy += (ty - P.vy) * k;
        P.x = clamp(P.x + P.vx * dt, S * 0.6, W - S * 0.6);
        P.y = clamp(P.y + P.vy * dt, S * 0.6, H - S * 0.6);
        if (Math.abs(P.vx) > 15) P.face = P.vx > 0 ? 1 : -1;
        P.flap += dt * (8 + Math.hypot(P.vx, P.vy) / S * 1.1);

        // spawn
        spawnT -= dt;
        if (spawnT <= 0 && birds.length < 22) {
          spawnBird();
          spawnT = playing ? Math.max(0.28, 0.85 - elapsed * 0.008) : 1.1;
        }

        // birds
        var hx = P.x + P.face * S * 0.3, hy = P.y, flee = S * 3.2;
        for (var i = birds.length - 1; i >= 0; i--) {
          var b = birds[i];
          var dx = b.x - hx, dy = b.y - hy, d = Math.hypot(dx, dy);
          if (playing && d < S * 1.05 + b.r) { catchBird(b); birds.splice(i, 1); continue; }
          if (playing && d < flee && d > 0) {
            var f = (1 - d / flee) * 260 * (S / 50);
            b.vy += dy / d * f * dt;
            b.vx += dx / d * f * dt * 0.3;
          }
          b.vy *= 0.96;
          b.x += b.vx * dt; b.y += b.vy * dt;
          if (b.x < -80 || b.x > W + 80 || b.y < -60 || b.y > H + 60) birds.splice(i, 1);
        }

        // particles and texts
        for (var p = parts.length - 1; p >= 0; p--) {
          var q = parts[p];
          q.life -= dt; if (q.life <= 0) { parts.splice(p, 1); continue; }
          q.vy += 320 * dt; q.vx *= 0.99;
          q.x += q.vx * dt; q.y += q.vy * dt; q.rot += q.vr * dt;
        }
        for (var m = texts.length - 1; m >= 0; m--) {
          var tt = texts[m];
          tt.life -= dt; if (tt.life <= 0) { texts.splice(m, 1); continue; }
          tt.y -= 46 * dt;
        }
        shake = Math.max(0, shake - dt * 30);
        for (var c = 0; c < clouds.length; c++) {
          var cl = clouds[c];
          cl.x -= cl.v * dt;
          if (cl.x < -140 * cl.s) { cl.x = W + 140 * cl.s; cl.y = H * (0.18 + Math.random() * 0.5); }
        }
      }

      /* ---------- drawing ---------- */
      function ridge(base, amp, ph, col) {
        ctx.beginPath(); ctx.moveTo(0, H);
        for (var x = 0; x <= W + 14; x += 14) {
          var y = base - amp * (0.55 + 0.3 * Math.sin(x * 0.004 + ph) + 0.25 * Math.sin(x * 0.011 + ph * 2.1) + 0.1 * Math.sin(x * 0.027 + ph * 3.3));
          ctx.lineTo(x, y);
        }
        ctx.lineTo(W + 14, H); ctx.closePath();
        ctx.fillStyle = col; ctx.fill();
      }

      function drawBackdrop() {
        ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
        for (var i = 0; i < stars.length; i++) {
          var st = stars[i];
          ctx.fillStyle = 'rgba(255,241,208,' + st.a + ')';
          ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, 6.2832); ctx.fill();
        }
        var sx = W * 0.76, sy = H * 0.74;
        var g = ctx.createRadialGradient(sx, sy, S * 0.5, sx, sy, S * 4.2);
        g.addColorStop(0, 'rgba(255,214,140,0.9)'); g.addColorStop(1, 'rgba(255,160,80,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx, sy, S * 4.2, 0, 6.2832); ctx.fill();
        ctx.fillStyle = '#ffd89a'; ctx.beginPath(); ctx.arc(sx, sy, S * 1.5, 0, 6.2832); ctx.fill();
        for (var c = 0; c < clouds.length; c++) {
          var cl = clouds[c];
          ctx.fillStyle = 'rgba(255,200,170,0.16)';
          ctx.beginPath();
          ctx.ellipse(cl.x, cl.y, 70 * cl.s, 15 * cl.s, 0, 0, 6.2832);
          ctx.ellipse(cl.x + 40 * cl.s, cl.y - 8 * cl.s, 45 * cl.s, 13 * cl.s, 0, 0, 6.2832);
          ctx.ellipse(cl.x - 38 * cl.s, cl.y - 5 * cl.s, 40 * cl.s, 11 * cl.s, 0, 0, 6.2832);
          ctx.fill();
        }
        ridge(H * 0.9, H * 0.24, 1.3, '#4a2468');
        ridge(H * 0.98, H * 0.2, 4.1, '#2a1448');
      }

      function feather(len, wid, fill) {
        ctx.beginPath(); ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(len * 0.5, -wid, len, 0);
        ctx.quadraticCurveTo(len * 0.5, wid * 0.55, 0, 0);
        ctx.closePath();
        ctx.fillStyle = fill; ctx.fill();
        ctx.strokeStyle = 'rgba(60,10,20,0.55)'; ctx.lineWidth = 1.2; ctx.stroke();
      }

      function wing(px, py, a, fan, L, fills) {
        ctx.save(); ctx.translate(px, py);
        for (var i = 6; i >= 0; i--) {
          ctx.save(); ctx.rotate(a - i * fan);
          feather(L * (1 - i * 0.06), L * 0.16, fills[i % 2]);
          ctx.restore();
        }
        ctx.restore();
      }

      function drawGaruda(x, y, s, face, flap) {
        var wa = Math.sin(flap);
        ctx.save(); ctx.translate(x, y + Math.sin(flap) * s * 0.05); ctx.scale(face, 1);

        wing(0.05 * s, -0.25 * s, -2.1 + wa * 0.9 + 0.3, 0.13, 2.0 * s, [COL.crimsonDeep, '#5a1020']);

        // tail
        ctx.save(); ctx.translate(-0.85 * s, 0.05 * s);
        for (var t = -1; t <= 1; t++) {
          ctx.save(); ctx.rotate(Math.PI - 0.12 + t * 0.22);
          feather(0.95 * s, 0.14 * s, t === 0 ? COL.gold : COL.crimson);
          ctx.restore();
        }
        ctx.restore();

        // talons
        ctx.strokeStyle = COL.gold; ctx.lineWidth = Math.max(2, s * 0.08); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.beginPath(); ctx.moveTo(0.1 * s, 0.38 * s); ctx.lineTo(0.3 * s, 0.7 * s); ctx.lineTo(0.52 * s, 0.8 * s); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0.3 * s, 0.4 * s); ctx.lineTo(0.5 * s, 0.7 * s); ctx.lineTo(0.72 * s, 0.8 * s); ctx.stroke();

        // body
        ctx.fillStyle = COL.crimson;
        ctx.beginPath(); ctx.ellipse(0, 0, 1.0 * s, 0.48 * s, -0.1, 0, 6.2832); ctx.fill();
        ctx.fillStyle = COL.gold;
        ctx.beginPath(); ctx.ellipse(0.35 * s, 0.12 * s, 0.55 * s, 0.28 * s, -0.1, 0, 6.2832); ctx.fill();
        ctx.fillStyle = COL.goldDeep;
        ctx.beginPath(); ctx.ellipse(0.2 * s, 0.2 * s, 0.3 * s, 0.1 * s, -0.1, 0, 6.2832); ctx.fill();

        // neck and head
        ctx.fillStyle = COL.cream;
        ctx.beginPath(); ctx.ellipse(0.72 * s, -0.2 * s, 0.34 * s, 0.3 * s, 0.3, 0, 6.2832); ctx.fill();
        ctx.beginPath(); ctx.arc(0.98 * s, -0.4 * s, 0.31 * s, 0, 6.2832); ctx.fill();

        // crown
        ctx.fillStyle = COL.gold;
        for (var c = 0; c < 3; c++) {
          ctx.beginPath();
          ctx.moveTo(0.82 * s - c * 0.07 * s, -0.62 * s);
          ctx.lineTo(0.7 * s - c * 0.15 * s, -0.95 * s + c * 0.08 * s);
          ctx.lineTo(0.96 * s - c * 0.07 * s, -0.68 * s);
          ctx.closePath(); ctx.fill();
        }

        // beak
        ctx.fillStyle = COL.beak; ctx.strokeStyle = COL.goldDeep; ctx.lineWidth = 1.2; ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(1.2 * s, -0.52 * s);
        ctx.lineTo(1.66 * s, -0.38 * s);
        ctx.quadraticCurveTo(1.64 * s, -0.18 * s, 1.44 * s, -0.2 * s);
        ctx.lineTo(1.2 * s, -0.3 * s);
        ctx.closePath(); ctx.fill(); ctx.stroke();

        // eye and brow
        ctx.fillStyle = COL.ink;
        ctx.beginPath(); ctx.arc(1.08 * s, -0.44 * s, 0.06 * s, 0, 6.2832); ctx.fill();
        ctx.strokeStyle = COL.crimsonDeep; ctx.lineWidth = Math.max(2, s * 0.06);
        ctx.beginPath(); ctx.moveTo(0.92 * s, -0.6 * s); ctx.lineTo(1.2 * s, -0.5 * s); ctx.stroke();

        // near wing
        wing(0.1 * s, -0.2 * s, -2.1 + wa * 0.9, 0.13, 2.3 * s, [COL.gold, '#e0702a']);

        ctx.restore();
      }

      function drawBird(b, T) {
        var r = b.r, f = b.vx >= 0 ? 1 : -1, w = Math.sin(T * 14 + b.ph);
        ctx.save(); ctx.translate(b.x, b.y + Math.sin(T * 4 + b.ph) * r * 0.35); ctx.scale(f, 1);
        ctx.fillStyle = b.c;
        ctx.beginPath(); ctx.moveTo(-r, 0); ctx.lineTo(-r * 1.8, -r * 0.3); ctx.lineTo(-r * 1.8, r * 0.25); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.ellipse(0, 0, r * 1.1, r * 0.75, 0, 0, 6.2832); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.beginPath(); ctx.ellipse(r * 0.1, r * 0.25, r * 0.8, r * 0.4, 0, 0, 6.2832); ctx.fill();
        ctx.fillStyle = b.c;
        ctx.beginPath(); ctx.arc(r * 0.95, -r * 0.25, r * 0.5, 0, 6.2832); ctx.fill();
        ctx.fillStyle = '#ffd166';
        ctx.beginPath(); ctx.moveTo(r * 1.4, -r * 0.32); ctx.lineTo(r * 1.95, -r * 0.18); ctx.lineTo(r * 1.4, -r * 0.06); ctx.closePath(); ctx.fill();
        ctx.fillStyle = COL.ink;
        ctx.beginPath(); ctx.arc(r * 1.1, -r * 0.35, r * 0.1, 0, 6.2832); ctx.fill();
        ctx.save(); ctx.translate(-r * 0.1, -r * 0.2); ctx.rotate(-0.6 - w * 0.7);
        ctx.fillStyle = 'rgba(20,15,43,0.28)';
        ctx.beginPath(); ctx.ellipse(0, -r * 0.7, r * 0.32, r * 0.9, 0, 0, 6.2832); ctx.fill();
        ctx.strokeStyle = b.c; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.restore();
        ctx.restore();
      }

      function draw(T) {
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        ctx.save();
        if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
        drawBackdrop();
        for (var i = 0; i < birds.length; i++) drawBird(birds[i], T);
        drawGaruda(P.x, P.y, S, P.face, P.flap);
        for (var p = 0; p < parts.length; p++) {
          var q = parts[p];
          ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot);
          ctx.globalAlpha = clamp(q.life / q.max * 1.4, 0, 1);
          ctx.fillStyle = q.c;
          ctx.beginPath(); ctx.ellipse(0, 0, q.len, q.len * 0.32, 0, 0, 6.2832); ctx.fill();
          ctx.restore();
        }
        ctx.globalAlpha = 1;
        ctx.textAlign = 'center';
        ctx.font = '26px "Rozha One", Georgia, serif';
        for (var m = 0; m < texts.length; m++) {
          var tt = texts[m];
          ctx.globalAlpha = clamp(tt.life / 0.5, 0, 1);
          ctx.fillStyle = '#14102b'; ctx.fillText(tt.txt, tt.x + 1.5, tt.y + 1.5);
          ctx.fillStyle = COL.cream; ctx.fillText(tt.txt, tt.x, tt.y);
        }
        ctx.globalAlpha = 1;
        ctx.restore();
      }

      /* ---------- input ---------- */
      function setPtr(e) {
        var r = cv.getBoundingClientRect();
        ptr = { x: e.clientX - r.left, y: e.clientY - r.top };
      }
      cv.addEventListener('pointerdown', setPtr);
      cv.addEventListener('pointermove', setPtr);
      function endPtr(e) { if (e.pointerType !== 'mouse') ptr = null; }
      cv.addEventListener('pointerup', endPtr);
      cv.addEventListener('pointercancel', endPtr);
      cv.addEventListener('pointerleave', function (e) { if (e.pointerType === 'mouse') ptr = null; });

      var keyMap = {
        ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right',
        ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down'
      };
      window.addEventListener('keydown', function (e) {
        var k = keyMap[e.key];
        if (!k) return;
        keys[k] = true; ptr = null;
        if (e.key.indexOf('Arrow') === 0) e.preventDefault();
      });
      window.addEventListener('keyup', function (e) { var k = keyMap[e.key]; if (k) keys[k] = false; });

      $('go').addEventListener('click', startGame);
      $('snd').addEventListener('click', function () {
        muted = !muted;
        this.textContent = 'Sound: ' + (muted ? 'off' : 'on');
        this.setAttribute('aria-pressed', muted ? 'true' : 'false');
      });

      /* ---------- loop ---------- */
      window.addEventListener('resize', resize);
      resize();
      var last = performance.now(), T = 0;
      function frame(now) {
        var dt = Math.min(0.05, (now - last) / 1000);
        last = now; T += dt;
        update(dt, T);
        draw(T);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    })();
  </script>
</body>

</html>
